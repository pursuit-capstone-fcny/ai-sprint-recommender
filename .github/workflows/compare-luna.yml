name: Compare GPT-6 Luna benchmark

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: recommendation-evaluation
  cancel-in-progress: false

jobs:
  compare:
    if: >-
      github.event.pull_request.number == 76 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.label.name == 'compare-luna-test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install and check without provider calls
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
      - name: Run one approved comparison
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LUNA_EVALUATION_APPROVAL: ${{ vars.LUNA_EVALUATION_APPROVAL }}
          LUNA_APPROVAL_FILE: ${{ runner.temp }}/luna-approval.json
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          if (!process.env.LUNA_EVALUATION_APPROVAL) throw new Error('Missing owner approval for this exact workflow attempt.');
          writeFileSync(process.env.LUNA_APPROVAL_FILE, process.env.LUNA_EVALUATION_APPROVAL, {mode: 0o600});
          JS
          node scripts/compare-luna.mjs
      - name: Save complete or partial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: luna-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/evaluation/luna/
          retention-days: 30
          if-no-files-found: warn
      - name: Summarize comparison
        if: always()
        run: |
          if [ -f build/evaluation/luna/comparison.md ]; then
            cat build/evaluation/luna/comparison.md >> "$GITHUB_STEP_SUMMARY"
          fi
