name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install and build
        env:
          VITE_LIBRARY_ORIGIN: ${{ vars.LIBRARY_PRODUCTION_ORIGIN }}
          VITE_CATALOG_SOURCE: static
          VITE_LLM_ENABLED: ${{ vars.LLM_PRODUCTION_ENABLED == 'true' && 'true' || 'false' }}
          VITE_LLM_QUEUE_ENABLED: 'true'
          VITE_USAGE_ENVIRONMENT: production
          VITE_USAGE_ENABLED: ${{ vars.USAGE_PRODUCTION_ENABLED == 'true' && 'true' || 'false' }}
          VITE_USAGE_BUFFER_ENABLED: ${{ vars.USAGE_BUFFER_PRODUCTION_ENABLED == 'true' && 'true' || 'false' }}
          USAGE_BATCH_SECRET: ${{ secrets.USAGE_BATCH_SECRET }}
          VITE_USAGE_PRODUCTION_URL: ${{ vars.CATALOG_PRODUCTION_URL }}
          VITE_USAGE_TEST_URL: ''
          VITE_FEEDBACK_ENABLED: ${{ vars.FEEDBACK_PRODUCTION_ENABLED == 'true' && 'true' || 'false' }}
          VITE_FEEDBACK_QUESTION: ${{ vars.FEEDBACK_QUESTION }}
          VITE_REQUESTS_ENABLED: ${{ vars.REQUESTS_PRODUCTION_ENABLED == 'true' && 'true' || 'false' }}
          VITE_REQUESTS_CONFIG: ${{ vars.REQUESTS_CONFIG }}
        run: |
          [[ -n "$VITE_LIBRARY_ORIGIN" ]]
          pnpm install --frozen-lockfile
          pnpm build
          node scripts/configure-library-app.mjs

      # PR previews upload undeployed versions of this same Worker. Deploy the
      # runtime first so secret updates apply to a deployed version, and create
      # its production Durable Object before permitting paid requests.
      # Preserve the configured usage flag: disabling it purges pending events.
      - name: Deploy production runtime with provider calls disabled
        if: vars.LLM_PRODUCTION_ENABLED == 'true' || vars.USAGE_BUFFER_PRODUCTION_ENABLED == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.library.jsonc --var LLM_ENABLED:false

      - name: Configure production provider secrets
        if: vars.LLM_PRODUCTION_ENABLED == 'true' || vars.USAGE_BUFFER_PRODUCTION_ENABLED == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USAGE_BATCH_SECRET: ${{ secrets.USAGE_BATCH_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/configure-production-secrets.mjs

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.library.jsonc
