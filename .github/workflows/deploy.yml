name: Deploy production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install and build
        env:
          VITE_LIBRARY_ORIGIN: ${{ vars.LIBRARY_PRODUCTION_ORIGIN }}
          VITE_CATALOG_SOURCE: static
          VITE_USAGE_ENVIRONMENT: production
          VITE_USAGE_ENABLED: 'false'
          VITE_USAGE_TEST_URL: ''
        run: |
          [[ -n "$VITE_LIBRARY_ORIGIN" ]]
          pnpm install --frozen-lockfile
          pnpm build
          node scripts/configure-library-app.mjs

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.library.jsonc
