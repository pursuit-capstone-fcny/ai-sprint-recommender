name: Deploy preview

on:
  pull_request:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install and build
        env:
          VITE_LIBRARY_ORIGIN: ${{ vars.LIBRARY_TEST_ORIGIN }}
          VITE_LIBRARY_DEMO: ${{ vars.LIBRARY_TEST_ORIGIN && 'false' || 'true' }}
          VITE_CATALOG_SOURCE: static
          VITE_USAGE_ENVIRONMENT: test
          # Opt in only after deploying and verifying the matching collector.
          VITE_USAGE_ENABLED: ${{ vars.LIBRARY_TEST_COLLECTION_READY == 'true' && vars.LIBRARY_TEST_ORIGIN && vars.CATALOG_TEST_URL && 'true' || 'false' }}
          VITE_USAGE_TEST_URL: ${{ vars.CATALOG_TEST_URL }}
        run: |
          pnpm install --frozen-lockfile
          if [[ -z "$VITE_LIBRARY_ORIGIN" ]]; then node scripts/seed-library-demo.mjs; fi
          pnpm build
          node scripts/configure-library-app.mjs

      # Uploads a preview version and prints its preview URL in the run log.
      # Production is untouched until the PR merges and deploy.yml runs.
      - name: Upload Cloudflare preview version
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --config wrangler.library.jsonc
