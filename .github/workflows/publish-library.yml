name: Publish library
run-name: Publish library ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Publisher request UUID
        required: true
      catalog_commit:
        description: Immutable content commit on the environment's library-data branch
        required: true
      environment:
        description: Isolated publishing target
        type: choice
        options: [test, production]
        required: true
      preview_name:
        description: Optional isolated test preview name
        type: string
        default: ''
      data_branch:
        description: Optional isolated test data branch
        type: string
        default: ''
      app_collector_url:
        description: Optional collector URL for a manually requested isolated app preview
        type: string
        default: ''
      app_feedback_enabled:
        description: Enable helpfulness feedback in the isolated test app
        type: boolean
        default: false
      app_requests_config:
        description: Optional public request policy for the isolated test app
        type: string
        default: ''
      app_live_haiku:
        description: Run a fifteen-minute isolated Haiku test with a five-cent budget
        type: boolean
        default: false
      app_analytics_url:
        description: Optional private analytics dashboard for the isolated test app
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: publish-library-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate dispatch
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CONTENT_COMMIT: ${{ inputs.catalog_commit }}
          TARGET: ${{ inputs.environment }}
          PREVIEW_NAME: ${{ inputs.preview_name }}
          DATA_BRANCH: ${{ inputs.data_branch || (inputs.environment == 'production' && 'library-data' || 'library-data-test') }}
          APP_COLLECTOR_URL: ${{ inputs.app_collector_url }}
          APP_FEEDBACK_ENABLED: ${{ inputs.app_feedback_enabled && 'true' || 'false' }}
          APP_REQUESTS_CONFIG: ${{ inputs.app_requests_config }}
          APP_LIVE_HAIKU: ${{ inputs.app_live_haiku && 'true' || 'false' }}
          APP_ANALYTICS_URL: ${{ inputs.app_analytics_url }}
        run: |
          [[ "$REQUEST_ID" =~ ^[a-f0-9-]{36}$ ]]
          [[ "$CONTENT_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TARGET" == test || "$TARGET" == production ]]
          if [[ "$TARGET" == production ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]]
            [[ -z "$PREVIEW_NAME" && "$DATA_BRANCH" == library-data ]]
          elif [[ -n "$PREVIEW_NAME" ]]; then
            [[ "$PREVIEW_NAME" =~ ^[a-z0-9][a-z0-9-]{0,31}$ ]]
            [[ "$DATA_BRANCH" == "library-data-test-$PREVIEW_NAME" ]]
          else
            [[ "$DATA_BRANCH" == library-data-test ]]
          fi
          if [[ -n "$APP_COLLECTOR_URL" ]]; then
            [[ "$TARGET" == test && -n "$PREVIEW_NAME" ]]
            [[ "$APP_COLLECTOR_URL" =~ ^https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec$ ]]
          fi
          if [[ "$APP_FEEDBACK_ENABLED" == true || -n "$APP_REQUESTS_CONFIG" || "$APP_LIVE_HAIKU" == true ]]; then
            [[ -n "$APP_COLLECTOR_URL" && "$TARGET" == test && -n "$PREVIEW_NAME" ]]
          fi
          if [[ -n "$APP_ANALYTICS_URL" ]]; then
            [[ -n "$APP_COLLECTOR_URL" && "$TARGET" == test && -n "$PREVIEW_NAME" ]]
            [[ "$APP_ANALYTICS_URL" =~ ^https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec$ ]]
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Keep the newest archive even when an older manifest is selected for rollback.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.data_branch || (inputs.environment == 'production' && 'library-data' || 'library-data-test') }}
          path: library-archive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.catalog_commit }}
          path: library-input
          fetch-depth: 0
      - name: Verify content provenance
        env:
          CONTENT_COMMIT: ${{ inputs.catalog_commit }}
          TARGET: ${{ inputs.environment }}
          DATA_BRANCH: ${{ inputs.data_branch || (inputs.environment == 'production' && 'library-data' || 'library-data-test') }}
        working-directory: library-input
        run: |
          if [[ "$TARGET" == production ]]; then
            git merge-base --is-ancestor "$CONTENT_COMMIT" origin/library-data
          else
            git merge-base --is-ancestor "$CONTENT_COMMIT" "origin/$DATA_BRANCH"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Validate and build public assets
        run: |
          pnpm install --frozen-lockfile
          node scripts/build-library-assets.mjs library-input/catalog build/library-assets library-archive/catalog
      - name: Deploy test catalog
        if: inputs.environment == 'test' && inputs.preview_name == ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config library/wrangler.jsonc --name ai-sprint-library-test
      - name: Deploy isolated test catalog preview
        if: inputs.environment == 'test' && inputs.preview_name != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview --name ${{ inputs.preview_name }} --worker-name ai-sprint-library-test --config library/wrangler.jsonc --ignore-base-config
      - name: Deploy production catalog
        if: inputs.environment == 'production'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config library/wrangler.jsonc
      # Only explicit test dispatches build this app. The Sheet publisher never
      # supplies app_collector_url, so ordinary content publication stays catalog-only.
      - name: Build isolated workflow-test app
        if: inputs.app_collector_url != ''
        env:
          PREVIEW_NAME: ${{ inputs.preview_name }}
          TEST_ORIGIN: ${{ vars.LIBRARY_TEST_ORIGIN }}
          VITE_USAGE_TEST_URL: ${{ inputs.app_collector_url }}
          VITE_USAGE_ENVIRONMENT: test
          VITE_USAGE_ENABLED: 'true'
          VITE_CATALOG_SOURCE: static
          VITE_LIBRARY_DEMO: 'false'
          VITE_LLM_ENABLED: ${{ inputs.app_live_haiku && 'true' || 'false' }}
          PRIVATE_TEST_LIVE_HAIKU: ${{ inputs.app_live_haiku && 'true' || 'false' }}
          VITE_REQUESTS_ENABLED: ${{ inputs.app_requests_config != '' && 'true' || 'false' }}
          VITE_REQUESTS_CONFIG: ${{ inputs.app_requests_config }}
          VITE_FEEDBACK_ENABLED: ${{ inputs.app_feedback_enabled && 'true' || 'false' }}
          VITE_FEEDBACK_QUESTION: ${{ inputs.app_feedback_enabled && 'Was this helpful?' || '' }}
          VITE_ADMIN_ANALYTICS_URL: ${{ inputs.app_analytics_url }}
        run: |
          [[ "$TEST_ORIGIN" =~ ^https://ai-sprint-library-test\.[a-zA-Z0-9-]+\.workers\.dev$ ]]
          export VITE_LIBRARY_ORIGIN="https://$PREVIEW_NAME-${TEST_ORIGIN#https://}"
          if [[ -n "$VITE_REQUESTS_CONFIG" ]]; then
            node --input-type=module -e 'import { ContributionConfigSchema } from "./src/contracts/contribution.ts"; const config = ContributionConfigSchema.parse(JSON.parse(process.env.VITE_REQUESTS_CONFIG)); if (config.endpoint !== process.env.VITE_USAGE_TEST_URL) throw new Error("Requests must use the isolated collector");'
          fi
          pnpm build
          export LLM_TEST_EXPIRES_AT="$(date -u -d '+15 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/configure-library-app.mjs
      - name: Prepare temporary preview credentials
        if: inputs.app_collector_url != ''
        env:
          PROVIDER_KEY: ${{ inputs.app_live_haiku && secrets.ANTHROPIC_API_KEY || '' }}
          LIVE_HAIKU: ${{ inputs.app_live_haiku && 'true' || 'false' }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { randomBytes } from 'node:crypto';
          if (process.env.LIVE_HAIKU === 'true' && !process.env.PROVIDER_KEY) throw new Error('Missing provider credential');
          writeFileSync(`${process.env.RUNNER_TEMP}/preview-secrets.json`, JSON.stringify({
            ANTHROPIC_API_KEY: process.env.PROVIDER_KEY,
            LLM_RATE_KEY: process.env.LIVE_HAIKU === 'true' ? randomBytes(32).toString('hex') : '',
          }), { mode: 0o600 });
          NODE
      - name: Deploy isolated workflow-test app
        if: inputs.app_collector_url != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview --name ${{ inputs.preview_name }} --config wrangler.library.jsonc --ignore-base-config --secrets-file ${{ runner.temp }}/preview-secrets.json
      - name: Remove temporary credential file
        if: always() && inputs.app_collector_url != ''
        run: rm -f "$RUNNER_TEMP/preview-secrets.json"
