name: One-time full-catalog scoring samples
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: recommendation-evaluation
  cancel-in-progress: false
jobs:
  samples:
    if: >-
      github.event.pull_request.number == 109 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.FULL_CATALOG_SCORING_APPROVAL != '' &&
      github.run_attempt == 2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Execute the exact approved sample pass
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
          FULL_CATALOG_SCORING_APPROVAL: ${{ vars.FULL_CATALOG_SCORING_APPROVAL }}
          FULL_CATALOG_SCORING_PAYLOAD: ${{ vars.FULL_CATALOG_SCORING_PAYLOAD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/run-scoring-samples.mjs
      - name: Preserve new sample evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-catalog-scoring-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/scoring-samples/
          retention-days: 30
          if-no-files-found: warn
